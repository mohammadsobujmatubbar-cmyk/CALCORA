name: CALCORA Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: |
          for i in 1 2 3; do gradle assembleDebug --stacktrace && break; echo "Retry $i"; sleep 30; done
          test -f app/build/outputs/apk/debug/app-debug.apk
      - run: |
          v=$(cat VERSION)
          cp app/build/outputs/apk/debug/app-debug.apk CALCORA.v$v.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CALCORA
          path: CALCORA.v*.apk
